services:
  lubelogger-mcp:
    image: ghcr.io/adityasanehi/lubelogger_mcp:edge
    environment:
      LUBELOG_INSTANCE: ${LUBELOG_INSTANCE:-http://app:8080}
    restart: unless-stopped
    ports:
      - "40150:8080"
    # Include this service in the app compose project/network so `app` resolves.
    # Supply auth on MCP requests; do not store account credentials here.
